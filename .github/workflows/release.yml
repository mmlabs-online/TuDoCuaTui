# T-007: a push to a branch `release/vX.Y.Z` (commit must already be on main) releases exactly
# version vX.Y.Z (it must be new and higher than every existing vX.Y.Z tag), creates and pushes that
# git tag, builds and pushes mingming21400/tudocuatui, then opens a pull
# request release/tudocuatui-vX.Y.Z on mmlabs-online/deployment that changes only apps/tudocuatui/release.env
# (image pinned by digest). Merging it runs deploy-tudocuatui on macbook-runner.
# Copied from stoktok's release.yml (one image instead of two). Runbook: README.md, "Deploy".
#
# Secrets in this repo:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN  push to mingming21400/tudocuatui
#   DEPLOY_REPO_TOKEN                    fine-grained PAT on mmlabs-online/deployment only:
#                                        Contents read/write, Pull requests read/write
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY  optional, build args. Public values only (R3):
#                                        the stoktok project URL and its anon/publishable key.
#                                        Both empty = the release runs in local mode.
# T-008: the validated tag is also passed as build arg VITE_APP_VERSION and shown in the app footer.

name: release

on:
  push:
    branches: ["release/v*"]

permissions:
  contents: write # push the version tag

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP: tudocuatui # folder apps/<APP>/ in the deployment repo
  NAMESPACE: mingming21400 # Docker Hub account

jobs:
  release:
    runs-on: ubuntu-latest # GitHub's runner: app code never runs on the home server
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: guards
        id: version
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main: merge main into release, never commit to release directly"; exit 1
          fi
          if git tag --points-at "$GITHUB_SHA" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$GITHUB_SHA is already released ($(git tag --points-at "$GITHUB_SHA" | tr '\n' ' '))"; exit 1
          fi
          if ! [[ "$GITHUB_REF_NAME" =~ ^release/(v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            echo "::error::branch '$GITHUB_REF_NAME' is not release/vX.Y.Z (for example release/v0.2.0)"; exit 1
          fi
          TAG="${BASH_REMATCH[1]}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists: pick a new version branch"; exit 1
          fi
          last="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$last" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]; then
            echo "::error::$TAG is not higher than the latest release $last"; exit 1
          fi
          echo "release version: $TAG (previous: ${last:-none})"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          for name in DH_USER DH_TOKEN DEPLOY_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::repository secret for $name is empty (see README.md, Deploy)"; exit 1
            fi
          done
          # R3: only the public URL and the anon/publishable key may be baked into the image.
          bash scripts/check-public-supabase-env.sh
          if [ -n "$VITE_SUPABASE_URL" ]; then mode="Supabase mode"; else mode="local mode"; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # Reserve the version before pushing the image: a failed run never reuses it.
      - name: create version tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "refs/tags/$TAG"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.NAMESPACE }}/tudocuatui:${{ steps.version.outputs.tag }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_APP_VERSION=${{ steps.version.outputs.tag }}
          # No build-arg metadata in attestations.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      # Check the exact bytes that will be pinned. If this fails, no PR is opened.
      - name: verify pushed digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          EXPECTED_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          ref="$NAMESPACE/tudocuatui@$DIGEST"
          docker pull "$ref"
          bash scripts/check-image.sh "$ref" ${SUPABASE_URL:+"$SUPABASE_URL"}

      - name: pull request on the deployment repo
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          MODE: ${{ steps.version.outputs.mode }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          branch="release/$APP-$TAG"
          image_ref="$NAMESPACE/tudocuatui:$TAG@$DIGEST"
          git clone --depth 1 "https://x-access-token:$GH_TOKEN@github.com/mmlabs-online/deployment.git" deployment
          cd deployment
          git switch -c "$branch"
          mkdir -p "apps/$APP"
          {
            echo "# Written by the $APP release workflow for $TAG (commit $GITHUB_SHA). Do not edit by hand."
            echo "TUDOCUATUI_IMAGE=$image_ref"
            echo "TUDOCUATUI_VERSION=$TAG"
          } > "apps/$APP/release.env"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/$APP/release.env"
          if [ "$(git diff --cached --name-only)" != "apps/$APP/release.env" ]; then
            echo "::error::release commit must change only apps/$APP/release.env"; exit 1
          fi
          git commit -m "$APP $TAG"
          git push origin "$branch"
          gh pr create --repo mmlabs-online/deployment --base main --head "$branch" \
            --title "$APP $TAG" \
            --body "Deploys \`$image_ref\` ($MODE build; $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA). Merging runs deploy-$APP on macbook-runner."
