name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # T-012: DB tests run against a real Postgres 17; they must not skip in CI (R8).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:coverage
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: migrate CLI smoke
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        shell: bash
        run: |
          node server/migrate.js
          node server/migrate.js | tee /dev/stderr | grep -q "up to date"
      - run: pnpm format:check
      - run: pnpm build

  # T-007/T-015: builds the production image (Node server, D26) twice (no build args; then with a dummy release
  # version) and checks both. The first check also runs migrate + /readyz inside the image
  # against the postgres service. Never pushes, no registry login.
  image:
    needs: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build (no build args)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: tudocuatui:ci-local
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
      # T-008: VITE_APP_VERSION is a dummy version; the image above must show dev.
      - name: build (release version)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: tudocuatui:ci-version
          build-args: |
            VITE_APP_VERSION=v0.0.0
          cache-from: type=gha,scope=image
      - run: bash scripts/check-image.sh tudocuatui:ci-local
        env:
          CHECK_IMAGE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      - run: bash scripts/check-image.sh tudocuatui:ci-version
        env:
          EXPECTED_VERSION: v0.0.0
