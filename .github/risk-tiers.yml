# Draft v1 (F-003). Not enforced yet; no CI step computes tiers.
# Precedence: high > low > default. Globs use gitignore syntax.
# Ming reviews this file (D10).
version: 1
default: medium
high:
  # DB migrations
  - "db/migrations/**"
  # API, Access JWT check, DB access, Drive and AI secrets
  - "server/**"
  # Production deploy workflows
  - ".github/workflows/deploy*"
  # Self-hosted image and release pipeline (T-007, D20)
  - "Dockerfile"
  - ".dockerignore"
  - "docker/**"
  - ".github/workflows/release.yml"
  - "deploy/**"
  - "scripts/check-image.sh"
  # Cloudflare Pages redirects (legacy: D5, superseded by D20)
  - "public/_redirects"
  # Cloudflare Pages config (legacy: D5, superseded by D20)
  - "wrangler.toml"
  # This file sets the merge rules for every later PR
  - ".github/risk-tiers.yml"
low:
  - "docs/**"
  - "work/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
